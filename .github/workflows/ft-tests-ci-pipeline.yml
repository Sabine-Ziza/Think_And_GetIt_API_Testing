name: FT CI Pipeline Branch Tests

on:
  push:
    branches:
      - 'ft/**'
      - 'main'

  pull_request:
    branches:
      - 'ft/**'
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Create config.properties
        run: |
          mkdir -p src/test/resources
          echo "base.url=${{ secrets.BASE_URL }}" > src/test/resources/config.properties

      - name: Run Tests
        run: mvn clean test
